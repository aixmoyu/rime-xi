patch:
  "style/font_face": "Segoe UI Emoji:30:39, Segoe UI Emoji:23:23, Segoe UI Emoji:2a:2a, Segoe UI Emoji:fe0f:fe0f, Segoe UI Emoji:20e3:20e3, 更纱黑体 UI SC, Microsoft YaHei::medium"
  "style/label_font_face": "更纱黑体 UI SC::light, Microsoft YaHei::light"
  "style/comment_font_face": "更纱黑体 UI SC::light:italic, Microsoft YaHei::light:italic"
  "style/font_point": 10
  "style/label_font_point": 8
  "style/comment_font_point": 8

  "style/color_scheme": nord
  "style/color_scheme_dark": nord_dark

  "style/inline_preedit": true
  "style/preedit_type": composition

  "style/horizontal": true

  "style/mark_text": "»"
  "style/hover_type": semi_hilite
  "style/paging_on_scroll": true

  "style/layout/baseline": 100
  "style/layout/linespacing": 120
  "style/layout/min_width": 80
  "style/layout/border_width": 4
  "style/layout/margin_x": 7
  "style/layout/margin_y": 5
  "style/layout/spacing": 8
  # "style/layout/candidate_spacing": 6 # 垂直布局时的候选项间距
  "style/layout/candidate_spacing": 16
  "style/layout/hilite_spacing": 6
  "style/layout/hilite_padding_x": 4
  "style/layout/hilite_padding_y": 2
  "style/layout/shadow_radius": 4
  "style/layout/shadow_offset_x": 1
  "style/layout/shadow_offset_y": 1
  "style/layout/corner_radius": 4
  "style/layout/round_corner": 4

  "preset_color_schemes/nord": # 浅色：与 macOS 端 squirrel.custom.yaml 同一套色板
    name: "远山／Nord"
    author: aixmoyu（Mirtle 原案）
    color_format: abgr # 两端统一 abgr；Windows 无毛玻璃，背景用不透明
    # 默认配色
    text_color: 0xE640342E                   # 文字
    shadow_color: 0xB4000000                 # 阴影
    label_color: 0xE66A564C                  # 标签
    comment_text_color: 0xE67087D0           # 注释
    border_color: 0xFFECEFF4                 # 边框（不透明）
    back_color: 0xFFECEFF4                   # 背景（不透明）
    # 普通候选项配色
    candidate_text_color: 0xE640342E         # 文字
    # 编码区域配色
    hilited_text_color: 0xFF40342E           # 文字
    hilited_back_color: 0xFFBBBC8F           # 背景
    # 选中的候选区域配色
    hilited_mark_color: 0xFF6A61BF           # 标签前的标记（极光红，配 mark_text »）
    hilited_label_color: 0xFF6A564C          # 标签（原版远山值：略淡于正文，形成层次）
    hilited_comment_text_color: 0xFF6A61BF   # 注释
    hilited_candidate_text_color: 0xFF40342E # 文字
    hilited_candidate_border_color: 0xFFBBBC8F # 边框
    hilited_candidate_back_color: 0xFFBBBC8F # 背景

  "preset_color_schemes/nord_dark": # 深色：与 macOS 端同步修复（青底深字、霜蓝注释）
    name: "黑山／Nord Dark"
    author: aixmoyu（Jungheil 原案）
    color_format: abgr # 两端统一 abgr；Windows 无毛玻璃，背景用不透明
    # 默认配色
    text_color: 0xE6FAF8F5 # 文字
    shadow_color: 0xB4000000 # 阴影（深色主题用黑影；原浅灰会形成光晕）
    label_color: 0xE6B7B0A4 # 标签
    comment_text_color: 0xE63C5AE8 # 注释（强调色朱红微调 #E85A3C，暗底 4.7:1）
    border_color: 0xFF231F1B # 边框（不透明）
    back_color: 0xFF231F1B # 背景（不透明）
    # 普通候选项配色
    candidate_text_color: 0xE6FAF8F5 # 文字
    # 编码区域配色
    hilited_text_color: 0xFFFAF8F5 # 文字
    hilited_back_color: 0xDD9E9F5F # 背景
    # 选中的候选区域配色
    hilited_mark_color: 0xFFB4C4FF # 标签前的标记（浅珊瑚提亮 #FFC4B4）
    hilited_label_color: 0xFFE9DED8 # 标签（柔白 #D8DEE9，略淡于正文形成层次）
    hilited_comment_text_color: 0xFFB4C4FF # 注释（浅珊瑚提亮 #FFC4B4）
    hilited_candidate_text_color: 0xFFFAF8F5 # 文字（白色）
    hilited_candidate_border_color: 0xDD9E9F5F # 边框
    hilited_candidate_back_color: 0xDD9E9F5F # 背景
