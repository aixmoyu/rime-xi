#键盘布局
preset_keyboards:
  default:
    name: default
    ascii_mode: 0
    height: 38
    height_land: 28
    horizontal_gap: 6
    vertical_gap: 8
    vertical_gap_land: 4
    round_corner: 6
    key_text_offset_x: 0
    key_text_offset_y: 3
    key_press_text_offset_x: 0
    key_press_text_offset_y: 0
    key_upper_press_text_offset_x: 0
    key_upper_press_text_offset_y: 0
    key_upper_text_offset_x: 0
    key_upper_text_offset_y: 5
    key_down_text_offset_x: 0
    key_down_text_offset_y: -1
    key_down_press_text_offset_x: 0
    key_down_press_text_offset_y: 0
    preview_round_corner: 9
    long_preview_round_corner: 9
    long_preview_padding: 0
    long_preview_margin: 4
    preview: true
    shadow: { radius: 0.1, offsetX: 0, offsetY: 1.2, color: "#90949C" }
    menu:  { events: [ eisu_toggle_emoji, eisu_toggle_clip_board, function_handwriting_find, eisu_toggle_one_hand_board ] }
    keys:
    # 1
    - { click: q, label: Q, swipe_up: send_1 }
    - { click: w, label: W, swipe_up: send_2 }
    - { click: e, label: E, swipe_up: send_3 }
    - { click: r, label: R, swipe_up: send_4 }
    - { click: t, label: T, swipe_up: send_5 }
    - { click: y, label: Y, swipe_up: send_6 }
    - { click: u, label: U, swipe_up: send_7 }
    - { click: i, label: I, swipe_up: send_8 }
    - { click: o, label: O, swipe_up: send_9 }
    - { click: p, label: P, swipe_up: send_0 }
    - { width: 5 }
    #2
    - { click: a, label: A, swipe_up: send_bang }
    - { click: s, label: S, swipe_up: send_at }
    - { click: d, label: D, swipe_up: send_hash }
    - { click: f, label: F, swipe_up: send_dollar }
    - { click: g, label: G, swipe_up: send_percent }
    - { click: h, label: H, swipe_up: send_amp }
    - { click: j, label: J, swipe_up: send_star }
    - { click: k, label: K, swipe_up: send_lparen }
    - { click: l, label: L, swipe_up: send_rparen }
    - { width: 5 }
    #3
    - { click: shift, width: 13, name: shift, preview: false }
    - { width: 2 }
    - { click: z, label: Z, swipe_up: send_quote }
    - { click: x, label: X, swipe_up: send_slash }
    - { click: c, label: C, swipe_up: send_minus }
    - { click: v, label: V, swipe_up: send_underscore }
    - { click: b, label: B, swipe_up: send_colon }
    - { click: n, label: N, swipe_up: send_semicolon_text }
    - { click: m, label: M, swipe_up: send_question }
    - { width: 2 }
    - { click: backspace, width: 13, name: backspace, preview: false, swipe_up: function_keyboard_clearAll, swipe_down: function_keyboard_undo }
    #4
    - { click: eisu_toggle_符_symbols_text, width: 15, name: symbol, preview: false }
    - { click: eisu_toggle_123_number_text, width: 11, name: number, preview: false }
    - { click: send_comma, label: ",", width: 10, name: comma, long_click: [commit_fullexclamationpoint], preview: false }
    - { click: space, width: 28, name: space, preview: false }
    - { click: send_period_text, label: ".", width: 10, name: period, long_click: [commit_fullquestionmark], preview: false }
    - { click: eisu_toggle_ABC_english_text, width: 11, name: english, preview: false }
    - { click: return, width: 15, name: return, composing: confirm, long_click: [function_keyboard_clearAll, function_keyboard_clearLeft, function_keyboard_clearRight, function_keyboard_undo, function_keyboard_redo, next], preview: false }
    width: 10

