# space.custom.yaml
# 用户自定义配置，使用librime patch语法覆盖space.yaml中的配置

patch:
  schema_id: rime_mint_mobile
  schema: oh-my-rime
  schema_dir: schemas/
  theme: moyu
  theme_dir: schemas/oh-my-rime/themes/
  symbol: default
  symbol_dir: symbols/
  emoticon: default
  emoticon_dir: emoticons/
  sound_on: false
  sound_volume: 0
  sound_effect: default
  haptics_on: true
  haptics_volume: 1
  haptic: crisp
  haptic_dir: haptics/
  speech: default
  speech_dir: speeches/
  font: jf-openhuninn-2.1
  font_dir: fonts/
